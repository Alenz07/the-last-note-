# Local infrastructure (optional — the app runs with ZERO of this using PGlite + disk).
# Use when you want to develop against real Postgres / Redis / S3-compatible storage:
#   docker compose up -d
#   DATABASE_URL=postgres://kadi:kadi@localhost:5432/kadi REDIS_URL=redis://localhost:6379 \
#   STORAGE_DRIVER=s3 S3_ENDPOINT=http://localhost:9000 S3_ACCESS_KEY_ID=kadi S3_SECRET_ACCESS_KEY=kadikadi S3_FORCE_PATH_STYLE=true pnpm dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kadi
      POSTGRES_PASSWORD: kadi
      POSTGRES_DB: kadi
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7-alpine
    ports: ['6380:6379']
  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: kadi
      MINIO_ROOT_PASSWORD: kadikadi
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio:/data']
  createbucket:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 kadi kadikadi; do sleep 1; done;
      mc mb -p local/kadi-media || true;
      exit 0"
volumes:
  pgdata:
  minio:
