# Production on one VPS (Hetzner CX22 / DO Bangalore $6): app + web + Postgres + Redis + Caddy (auto-HTTPS).
# Put Cloudflare (free) in front for edge cache + DDoS; media goes to R2 via env (see .env.example).
#
#   cp .env.example .env   # fill DOMAIN, POSTGRES_PASSWORD, APP_SECRET, ADMIN_PASSWORD, R2 + gateway keys
#   docker compose -f docker-compose.prod.yml up -d --build
#
services:
  app:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kadi:${POSTGRES_PASSWORD:-kadi}@db:5432/kadi
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      SEED_ON_EMPTY: ${SEED_ON_EMPTY:-false}
    depends_on: [db, redis]
    expose: ['3000']
    volumes:
      # only used if STORAGE_DRIVER=local; R2 is the intended production store
      - media:/app/.data
  # The public site. Separate image so it deploys and scales on its own.
  web:
    build:
      context: ./frontend
      args:
        # Inlined into the client bundle at build time - runtime env cannot
        # reach these, so changing a social link means a rebuild, not a restart.
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_WHATSAPP_URL: ${NEXT_PUBLIC_WHATSAPP_URL:-}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    restart: unless-stopped
    environment:
      # Only used by routes Caddy does not split off; server-side calls go direct.
      BACKEND_URL: http://app:3000
    depends_on: [app]
    expose: ['3001']
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kadi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kadi}
      POSTGRES_DB: kadi
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kadi']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru', '--save', '']
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, web]
  # nightly pg_dump → ./backups (ship this folder to R2 with rclone/cron)
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-kadi}
    volumes: ['./backups:/backups']
    entrypoint: >
      /bin/sh -c "while true; do
        pg_dump -h db -U kadi kadi | gzip > /backups/kadi-$$(date +%F).sql.gz;
        find /backups -name '*.sql.gz' -mtime +14 -delete;
        sleep 86400; done"
    depends_on: [db]
  # Ships the nightly dump AND the media folder off this machine. Without it,
  # the database and its only backups die together with the disk - and on a
  # single cheap VPS that is the likeliest way to lose everything.
  # Configure once: rclone config -> Google Drive (free, no card), then put the
  # generated rclone.conf in ./rclone/. Until then this container idles quietly.
  offsite:
    image: rclone/rclone:latest
    restart: unless-stopped
    volumes:
      - ./rclone:/config:ro
      - ./backups:/backups:ro
      - media:/media:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          if [ -s /config/rclone.conf ]; then
            rclone --config /config/rclone.conf copy /backups "${OFFSITE_REMOTE:-gdrive}:kadi/backups" --max-age 72h
            rclone --config /config/rclone.conf sync /media "${OFFSITE_REMOTE:-gdrive}:kadi/media"
            echo "[kadi] offsite sync done $(date -Iseconds)"
          else
            echo "[kadi] offsite backup not configured - put rclone.conf in ./rclone/"
          fi
          sleep 86400
        done
    depends_on: [backup]
volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
